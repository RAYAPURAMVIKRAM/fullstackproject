<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Apex Dental Clinic</title>
  <meta name="description" content="Secure administration portal login for Apex Dental Clinic management staff.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="auth-logo" title="Back to Clinic Website">
        <div class="brand-icon">🦷</div>
      </a>
      <h1>Admin Portal Login</h1>
      <p>Enter your administrator credentials to access the clinic management system.</p>
    </div>

    <!-- Alert Banner -->
    <div class="alert-banner" id="login-alert" role="alert">
      <div class="alert-icon" id="alert-icon">⚠️</div>
      <div class="alert-text">
        <h4 id="alert-title">Authentication</h4>
        <p id="alert-message">Status message appears here.</p>
      </div>
    </div>

    <form id="login-form" novalidate>
      <!-- Email / Username -->
      <div class="form-group" style="margin-bottom: 20px;">
        <label for="email" class="form-label">
          Admin Email or Username <span class="required">*</span>
        </label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="admin@dentalclinic.com" 
          autocomplete="username" 
          required
        >
        <div class="form-error-msg" id="email-error">Please enter your admin email.</div>
      </div>

      <!-- Password -->
      <div class="form-group" style="margin-bottom: 26px;">
        <label for="password" class="form-label">
          Password <span class="required">*</span>
        </label>
        <div class="input-password-wrapper">
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-control" 
            placeholder="••••••••" 
            autocomplete="current-password" 
            required
          >
          <button type="button" class="password-toggle-btn" id="toggle-password" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
        <div class="form-error-msg" id="password-error">Please enter your password.</div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">
        <span id="btn-text">Sign In to Dashboard</span>
        <span class="spinner" id="btn-spinner" style="display: none;"></span>
      </button>
    </form>

    <div class="auth-footer">
      <p style="margin-bottom: 8px;">
        <a href="index.html">← Back to Clinic Website</a>
      </p>
      <p style="font-size: 0.8rem; color: var(--text-light);">
        Default admin: <strong>admin@dentalclinic.com</strong> / <strong>admin123</strong>
      </p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
